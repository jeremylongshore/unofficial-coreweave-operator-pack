name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # gitleaks scans the full history
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Python dependencies
        run: python -m pip install --quiet -r requirements-dev.txt
      - name: Pinned toolchain (grader, kernel schemas, j-rig, gitleaks)
        run: tools/setup.sh
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Tests
        run: python -m pytest -q tests
      - name: Diagnostic self-tests
        run: |
          python skills/coreweave-fabric-diagnostics/scripts/fabric-check.py --self-test
          python skills/coreweave-gpu-node-forensics/scripts/triage.py --self-test
      - name: Pack gate
        run: python tools/validate-pack.py --report .cache/validation-receipt.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: validation-receipt
          path: .cache/validation-receipt.json
          if-no-files-found: ignore
