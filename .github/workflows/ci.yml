name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks scans the full history
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Python dependencies
        run: python -m pip install --quiet -r requirements-dev.txt
      - name: Pinned toolchain (grader, kernel schemas, j-rig, gitleaks)
        run: tools/setup.sh
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Tests
        run: python -m pytest -q tests
      - name: Diagnostic self-tests
        run: |
          python skills/coreweave-fabric-diagnostics/scripts/fabric-check.py --self-test
          python skills/coreweave-gpu-node-forensics/scripts/triage.py --self-test
      - name: Pack gate
        run: python tools/validate-pack.py --report .cache/validation-receipt.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: validation-receipt
          path: .cache/validation-receipt.json
          if-no-files-found: ignore
